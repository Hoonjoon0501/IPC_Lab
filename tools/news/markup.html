<section id="ipc-news" lang="en" aria-labelledby="ipc-news-heading">
  <div class="ipc-shell">
    <header class="ipc-heading">
      <h2 id="ipc-news-heading">News &amp; stories<span style="color:#2056b3">.</span></h2>
    </header>
    <div id="ipc-featured" class="ipc-featured" aria-label="Latest research updates"></div>
    <section class="ipc-archive" aria-labelledby="ipc-archive-title">
      <div class="ipc-archive-head">
        <h3 id="ipc-archive-title">Explore the archive</h3>
        <div class="ipc-years" id="ipc-years" role="group" aria-label="Filter news by year"></div>
      </div>
      <p class="ipc-year-summary" id="ipc-year-summary"></p>
      <div class="ipc-results" id="ipc-results"></div>
      <article class="ipc-detail" id="ipc-detail" aria-labelledby="ipc-detail-title" hidden>
        <button type="button" class="ipc-back" id="ipc-back">← Back to updates</button>
        <p class="ipc-detail-meta" id="ipc-detail-meta"></p>
        <h4 id="ipc-detail-title" tabindex="-1"></h4>
        <p class="ipc-detail-text" id="ipc-detail-text"></p>
        <div id="ipc-detail-media"></div>
      </article>
      <nav class="ipc-pagination" id="ipc-pagination" aria-label="News pages">
        <span class="ipc-range" id="ipc-range"></span>
        <div class="ipc-page-buttons" id="ipc-page-buttons"></div>
      </nav>
      <p class="ipc-sr-only" id="ipc-status" role="status" aria-live="polite"></p>
    </section>
    <noscript><p>Enable JavaScript to browse the news archive.</p></noscript>
  </div>
</section>
