const proj0 = [];
if (S === 'circuit') {

  [[x0 - 9.6, 3.2], [x0 - 3.2, -3.2], [x0 + 3.2, 3.2], [x0 + 9.6, -3.2], [x0, 0]].forEach(([x, z], i) => {
    const v = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 12.5, 12), M.glowSoft); v.position.set(x, 8.3, z); g.add(v);
    overlays.push({ id: 'up' + i, pts: [new THREE.Vector3(x, 2.4, z), new THREE.Vector3(x, 14.4, z)] });

  const bus = [V(-27, 7, 8), V(-16, 7, 8), V(-16, 18.5, -4)];
  overlays.push({ id: 'coil', pts: coil.filter((_, i) => i % 4 === 0).map(v => v.clone()) });
  camPos = V(44, 64, 104); camTarget = V(0, 8, 0); fov = 25;
} else if (S === 'wpt') {
  const g = new THREE.Group(); root.add(g);
  // transmitter pad (left) and a small sensor node far to the right
  g.add(at(box(34, 1.6, 34, M.pcb, 0.8), -22, 0.8, 0));
  g.add(tube(spiralPts(4, 14.5, 7, 1.9), 0.42, M.copper).translateX(-22));
  const node = new THREE.Group(); node.position.set(30, 0, -2);
  node.add(at(box(9, 6, 9, AL, 1.2), 0, 3, 0)); node.add(at(box(9.4, 0.6, 9.4, M.pcb, 0.3), 0, 6.3, 0));
  node.add(tube(spiralPts(1, 3.8, 4, 6.75), 0.22, M.copper));
  const led = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), M.glow); led.position.set(3, 4, 4.6); node.add(led);
  g.add(node);
  // magnetic field lines from the pad toward the node
  for (let k = 0; k < 4; k++) { const p = []; const h = 6 + k * 4.5; for (let i = 0; i <= 50; i++) { const t = i / 50; p.push(V(-22 + (30 + 22) * t, 2 + Math.sin(Math.PI * t) * h, -1 + k * 0.5)); } overlays.push({ id: 'f' + k, pts: p }); }
  camPos = V(20, 66, 122); camTarget = V(4, 6, 0); fov = 25;
} else if (S === 'wptres') {
  const g = new THREE.Group(); root.add(g);
  g.add(at(box(64, 1.6, 36, M.pcb, 0.7), 0, 0.8, 0));
  const top = 1.65;
  g.add(tube(spiralPts(3, 13.5, 6, top + 0.35), 0.5, M.copper).translateX(14));
  for (let i = 0; i < 5; i++) for (let j = 0; j < 2; j++) { const c = mlcc(4.4, 2.4, 2.1); c.position.set(-6, top, -8 + i * 4); c.translateX(j * 5.4 - 2.7); g.add(c); }
  [-24, -17].forEach(x => [-6, 4].forEach(z => g.add(at(qfn(5, 5, 1, 4), x, top, z))));
  const loop = [[-20, -10], [-6, -10], [-6, 10], [-20, 10], [-20, -10]];
  g.add(strip(loop, 0.6, M.glow, top + 0.06));
  overlays.push({ id: 'res', pts: spiralPts(3, 13.5, 6, top + 0.9, 220).map(v => v.add(V(14, 0, 0))) });
  camPos = V(56, 80, 112); camTarget = V(0, 2, 0); fov = 25;
}

const camera = (typeof orthoW !== 'undefined' && orthoW) ? new THREE.OrthographicCamera(-orthoW / 2, orthoW / 2, orthoW * H / W / 2, -orthoW * H / W / 2, 1, 2000) : new THREE.PerspectiveCamera(fov, W / H, 1, 1000);
camera.position.copy(camPos); camera.lookAt(camTarget);
renderer.render(scene, camera);
const proj = v => { const p = v.clone().project(camera); return [Math.round((p.x + 1) / 2 * W * 10) / 10, Math.round((1 - p.y) / 2 * H * 10) / 10]; };
document.getElementById('out').textContent = JSON.stringify(overlays.map(o => ({ id: o.id, closed: !!o.closed, pts: o.pts.map(proj) })).concat(proj0.length ? [{ id: 'slide', closed: false, pts: proj0.map(proj) }] : []));
document.title = 'done';
</script></body></html>
