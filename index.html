<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Researchers | Integrated Power Lab</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;

    background: #ffffff;
    color: #111111;

    font-family:
        Arial,
        "Helvetica Neue",
        Helvetica,
        sans-serif;
}

button,
a {
    font-family: inherit;
}


/* =========================================================
   PAGE CONTAINER

   GitHub Pages를 Google Sites full-page embed할 것을 고려
========================================================= */

.people-wrap {

    width: 100%;

    max-width: 1520px;

    margin: 0 auto;

    padding:
        54px
        clamp(28px, 5vw, 82px)
        100px;
}


/* =========================================================
   PAGE TITLE
========================================================= */

.page-header {

    display: flex;

    align-items: flex-end;
    justify-content: space-between;

    margin-bottom: 46px;
}


.page-title {

    margin: 0;

    font-size: 42px;
    line-height: 1;

    font-weight: 650;

    letter-spacing: -1.2px;
}


/* =========================================================
   TERM / CURRENT SELECTOR
========================================================= */

.people-controls {

    position: relative;
}


.term-picker {

    position: relative;
}


.term-trigger {

    display: flex;

    align-items: center;

    gap: 9px;

    padding: 4px 0;

    border: 0;

    background: transparent;

    color: #111111;

    font-size: 15px;

    cursor: pointer;
}


.term-chevron {

    font-size: 11px;

    transition:
        transform 0.2s ease;
}


.term-picker.open
.term-chevron {

    transform: rotate(180deg);
}


.term-menu {

    position: absolute;

    top: calc(100% + 12px);
    right: 0;

    min-width: 155px;

    padding: 5px 0;

    border:
        1px solid #dddddd;

    background:
        #ffffff;

    box-shadow:
        0 8px 26px
        rgba(0,0,0,0.07);

    z-index: 30;

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(-5px);

    transition:
        opacity 0.18s ease,
        transform 0.18s ease,
        visibility 0.18s ease;
}


.term-picker.open
.term-menu {

    opacity: 1;

    visibility: visible;

    transform:
        translateY(0);
}


.term-option {

    display: block;

    width: 100%;

    padding:
        11px
        16px;

    border: 0;

    background: #fff;

    color: #222;

    text-align: left;

    font-size: 14px;

    cursor: pointer;
}


.term-option:hover {

    background: #f4f4f4;
}


.term-option.active {

    font-weight: 650;
}


/* =========================================================
   MEMBER DETAIL
   DSIL처럼 GRID 위쪽에 표시
========================================================= */

.people-detail {

    display: none;

    position: relative;

    margin-bottom: 58px;

    padding:
        0
        0
        50px;

    border-bottom:
        1px solid #d7d7d7;
}


.people-detail.show {

    display: block;

    animation:
        detailFade
        0.32s ease;
}


@keyframes detailFade {

    from {
        opacity: 0;
        transform: translateY(-7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


.detail-close {

    position: absolute;

    top: 0;
    right: 0;

    width: 38px;
    height: 38px;

    border: 0;

    background: transparent;

    cursor: pointer;
}


.detail-close::before,
.detail-close::after {

    content: "";

    position: absolute;

    top: 18px;
    left: 5px;

    width: 28px;
    height: 1.5px;

    background: #111;
}


.detail-close::before {
    transform: rotate(45deg);
}


.detail-close::after {
    transform: rotate(-45deg);
}


/* =========================================================
   DETAIL LAYOUT
========================================================= */

.detail-layout {

    display: grid;

    grid-template-columns:
        minmax(260px, 31%)
        minmax(0, 1fr);

    gap:
        clamp(42px, 6vw, 90px);
}


.detail-photo {

    width: 100%;

    /*
      DSIL 코드의 a4-photo naming을 참고해
      A4 비율 적용
    */

    aspect-ratio:
        210 / 297;

    overflow: hidden;

    background:
        #eeeeee;
}


.detail-photo img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    object-position:
        center center;
}


.detail-content {

    padding:
        7px
        50px
        0
        0;
}


.detail-name {

    margin:
        0
        0
        8px;

    font-size:
        clamp(30px, 3vw, 42px);

    line-height:
        1.12;

    font-weight:
        650;

    letter-spacing:
        -0.8px;
}


.detail-role {

    margin-bottom:
        36px;

    color:
        #666666;

    font-size:
        16px;

    line-height:
        1.5;
}


/* =========================================================
   DETAIL SECTIONS
========================================================= */

.detail-section {

    margin-top:
        29px;
}


.detail-heading {

    margin-bottom:
        11px;

    font-size:
        12px;

    font-weight:
        700;

    letter-spacing:
        1.1px;

    text-transform:
        uppercase;
}


.detail-body {

    color:
        #333333;

    font-size:
        14.5px;

    line-height:
        1.75;
}


.detail-body p {

    margin:
        0
        0
        7px;
}


.detail-body ul {

    margin:
        4px
        0
        0;

    padding-left:
        19px;
}


.detail-body li {

    margin-bottom:
        4px;
}


/* research */

.research-area {

    margin-bottom:
        17px;
}


.research-area-title {

    margin-bottom:
        4px;

    font-weight:
        600;

    color:
        #1c1c1c;
}


/* contact */

.detail-email {

    color:
        #111111;

    text-decoration:
        none;

    border-bottom:
        1px solid #bdbdbd;
}


.detail-email:hover {

    border-bottom-color:
        #111111;
}


/* external links */

.member-links {

    display: flex;

    flex-wrap: wrap;

    gap:
        12px;

    margin-top:
        31px;
}


.member-link {

    display: inline-flex;

    align-items: center;

    gap: 6px;

    color:
        #111111;

    text-decoration:
        none;

    font-size:
        14px;

    font-weight:
        500;
}


.member-link:hover {

    text-decoration:
        underline;
}


/* =========================================================
   GRID
========================================================= */

.people-grid {

    width: 100%;

    display: grid;

    /*
      DSIL 느낌:
      넓은 화면 5열
    */

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    column-gap:
        clamp(18px, 2.2vw, 32px);

    row-gap:
        54px;
}


/* =========================================================
   MEMBER CARD

   border / shadow / radius 없음
========================================================= */

.member-card {

    display: block;

    width: 100%;

    margin: 0;
    padding: 0;

    border: 0;

    background:
        transparent;

    color:
        inherit;

    text-align:
        left;

    cursor:
        pointer;

    appearance:
        none;
}


.member-card-photo-wrap {

    position: relative;

    width: 100%;

    aspect-ratio:
        210 / 297;

    overflow:
        hidden;

    background:
        #eeeeee;

    margin-bottom:
        14px;
}


.member-card-photo {

    display: block;

    width: 100%;
    height: 100%;

    object-fit:
        cover;

    object-position:
        center center;

    transition:
        transform 0.35s ease,
        opacity 0.3s ease;
}


.member-card:hover
.member-card-photo {

    transform:
        scale(1.025);

    opacity:
        0.93;
}


/* Selected member */

.member-card.selected
.member-card-photo-wrap::after {

    content: "";

    position: absolute;

    bottom: 0;
    left: 0;
    right: 0;

    height:
        3px;

    background:
        #111111;
}


/* =========================================================
   CARD TEXT
========================================================= */

.member-card-name {

    margin-bottom:
        5px;

    font-size:
        17px;

    line-height:
        1.25;

    font-weight:
        650;

    letter-spacing:
        -0.2px;
}


.member-card-role {

    color:
        #6d6d6d;

    font-size:
        13px;

    line-height:
        1.45;
}


/* =========================================================
   TABLET
========================================================= */

@media
(max-width: 1200px) {

    .people-grid {

        grid-template-columns:
            repeat(4, minmax(0,1fr));
    }

}


@media
(max-width: 900px) {

    .people-grid {

        grid-template-columns:
            repeat(3, minmax(0,1fr));
    }


    .detail-layout {

        grid-template-columns:
            minmax(230px, 34%)
            minmax(0,1fr);

        gap:
            40px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media
(max-width: 620px) {

    .people-wrap {

        padding:
            30px
            15px
            60px;
    }


    .page-header {

        margin-bottom:
            30px;
    }


    .page-title {

        font-size:
            30px;
    }


    .people-grid {

        grid-template-columns:
            repeat(2, minmax(0,1fr));

        column-gap:
            14px;

        row-gap:
            36px;
    }


    .member-card-name {

        font-size:
            15px;
    }


    .member-card-role {

        font-size:
            12px;
    }


    .detail-layout {

        display:
            block;
    }


    .detail-photo {

        max-width:
            430px;

        margin:
            0 auto
            29px;
    }


    .detail-content {

        padding:
            0;
    }


    .detail-name {

        font-size:
            29px;
    }


    .detail-close {

        top:
            -43px;
    }

}

</style>
</head>


<body>


<main class="people-wrap">


    <!-- ===================================================
         DETAIL
         DSIL과 동일하게 Grid보다 위에 존재
    ==================================================== -->

    <section
        id="member-detail"
        class="people-detail"
    >

        <button
            type="button"
            class="detail-close"
            id="detailClose"
            aria-label="Close profile"
        ></button>


        <div class="detail-layout">


            <div class="detail-photo">

                <img
                    id="detailPhoto"
                    src=""
                    alt=""
                >

            </div>


            <div class="detail-content">


                <h2
                    class="detail-name"
                    id="detailName"
                ></h2>


                <div
                    class="detail-role"
                    id="detailRole"
                ></div>



                <!-- RESEARCH -->

                <section
                    class="detail-section"
                    id="researchSection"
                >

                    <div class="detail-heading">
                        Research
                    </div>

                    <div
                        class="detail-body"
                        id="detailResearch"
                    ></div>

                </section>



                <!-- EDUCATION -->

                <section
                    class="detail-section"
                    id="educationSection"
                >

                    <div class="detail-heading">
                        Education
                    </div>

                    <div
                        class="detail-body"
                        id="detailEducation"
                    ></div>

                </section>



                <!-- CAREER -->

                <section
                    class="detail-section"
                    id="careerSection"
                >

                    <div class="detail-heading">
                        Career
                    </div>

                    <div
                        class="detail-body"
                        id="detailCareer"
                    ></div>

                </section>



                <!-- CONTACT -->

                <section
                    class="detail-section"
                    id="contactSection"
                >

                    <div class="detail-heading">
                        Contact
                    </div>

                    <div
                        class="detail-body"
                        id="detailContact"
                    ></div>

                </section>



                <div
                    class="member-links"
                    id="detailLinks"
                ></div>


            </div>

        </div>

    </section>



    <!-- ===================================================
         HEADER + CURRENT SELECTOR
    ==================================================== -->

    <div class="page-header">


        <h1 class="page-title">
            Researchers
        </h1>


        <div class="people-controls">


            <div
                class="term-picker"
                id="termPicker"
            >


                <button
                    type="button"
                    class="term-trigger"
                    id="termTrigger"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                >

                    <span id="termLabel">
                        Current
                    </span>

                    <span
                        class="term-chevron"
                        aria-hidden="true"
                    >
                        ▾
                    </span>

                </button>


                <div
                    class="term-menu"
                    id="termMenu"
                >


                    <button
                        class="term-option active"
                        data-term="current"
                    >
                        Current
                    </button>


                    <button
                        class="term-option"
                        data-term="alumni"
                    >
                        Alumni
                    </button>


                </div>

            </div>

        </div>

    </div>



    <!-- ===================================================
         MEMBER GRID
    ==================================================== -->

    <div
        class="people-grid"
        id="peopleGrid"
    ></div>


</main>



<script>


/* =========================================================
   IPC MEMBER DATA

   이 부분만 수정하면 됨.
========================================================= */


const peopleData = {


    /* =====================================================
       CURRENT RESEARCHERS
    ====================================================== */

    current: [


        {
            id:
                "student01",

            name:
                "Student Name",

            role:
                "Ph.D. Student",

            photo:
                "images/student01.jpg",


            research: [

                {
                    area:
                        "Integrated Voltage Regulators",

                    topics: [

                        "Package-integrated magnetics",

                        "High-frequency DC-DC converters"

                    ]
                },

                {
                    area:
                        "Power Magnetics",

                    topics: [

                        "Coupled inductors",

                        "Magnetic component modeling"

                    ]
                }

            ],


            education: [

                "Ph.D. / School of Electrical Engineering, KAIST (2025 – present)",

                "B.S. / Electrical Engineering, University Name (2021 – 2025)"

            ],


            career: [],


            email:
                "student01@kaist.ac.kr",


            links: [

                /*
                {
                    label:
                        "Google Scholar",

                    url:
                        "https://scholar.google.com/..."
                },

                {
                    label:
                        "LinkedIn",

                    url:
                        "https://linkedin.com/..."
                }
                */

            ]

        },



        {
            id:
                "student02",

            name:
                "Student Name",

            role:
                "M.S.-Ph.D. Student",

            photo:
                "images/student02.jpg",


            research: [

                {
                    area:
                        "Power Delivery",

                    topics: [

                        "Vertical power delivery",

                        "Integrated power conversion"

                    ]
                }

            ],


            education: [

                "M.S.-Ph.D. / School of Electrical Engineering, KAIST",

                "B.S. / Electrical Engineering, University Name"

            ],


            career: [],


            email:
                "student02@kaist.ac.kr",


            links: []

        },



        {
            id:
                "student03",

            name:
                "Student Name",

            role:
                "M.S. Student",

            photo:
                "images/student03.jpg",


            research: [

                {
                    area:
                        "Power Electronics",

                    topics: [

                        "High-frequency power converters",

                        "Integrated passive components"

                    ]
                }

            ],


            education: [

                "M.S. / School of Electrical Engineering, KAIST",

                "B.S. / Electrical Engineering, University Name"

            ],


            career: [],


            email:
                "student03@kaist.ac.kr",


            links: []

        }

    ],



    /* =====================================================
       ALUMNI
    ====================================================== */

    alumni: [


        {
            id:
                "alumni01",

            name:
                "Alumni Name",

            role:
                "Alumni",

            photo:
                "images/alumni01.jpg",


            research: [

                {
                    area:
                        "Power Electronics",

                    topics: [

                        "Integrated voltage regulators"

                    ]
                }

            ],


            education: [

                "M.S. / KAIST (2024 – 2026)"

            ],


            career: [

                "Samsung Electronics"

            ],


            email:
                "",


            links: []

        }

    ]

};


/* =========================================================
   ELEMENT REFERENCES
========================================================= */


const peopleGrid =
    document.getElementById(
        "peopleGrid"
    );


const memberDetail =
    document.getElementById(
        "member-detail"
    );


const detailPhoto =
    document.getElementById(
        "detailPhoto"
    );


const detailName =
    document.getElementById(
        "detailName"
    );


const detailRole =
    document.getElementById(
        "detailRole"
    );


const detailResearch =
    document.getElementById(
        "detailResearch"
    );


const detailEducation =
    document.getElementById(
        "detailEducation"
    );


const detailCareer =
    document.getElementById(
        "detailCareer"
    );


const detailContact =
    document.getElementById(
        "detailContact"
    );


const detailLinks =
    document.getElementById(
        "detailLinks"
    );


const researchSection =
    document.getElementById(
        "researchSection"
    );


const educationSection =
    document.getElementById(
        "educationSection"
    );


const careerSection =
    document.getElementById(
        "careerSection"
    );


const contactSection =
    document.getElementById(
        "contactSection"
    );


const detailClose =
    document.getElementById(
        "detailClose"
    );


const termPicker =
    document.getElementById(
        "termPicker"
    );


const termTrigger =
    document.getElementById(
        "termTrigger"
    );


const termLabel =
    document.getElementById(
        "termLabel"
    );


const termOptions =
    document.querySelectorAll(
        ".term-option"
    );


let selectedCard =
    null;


/* =========================================================
   RENDER CARDS
========================================================= */


function renderPeople(term) {


    peopleGrid.innerHTML =
        "";


    closeMember();


    peopleData[term].forEach(
        member => {


            const card =
                document.createElement(
                    "button"
                );


            card.type =
                "button";


            card.className =
                "member-card";


            card.innerHTML = `

                <div class="member-card-photo-wrap">

                    <img
                        class="member-card-photo"
                        src="${member.photo}"
                        alt="${member.name}"
                        loading="lazy"
                        decoding="async"
                    >

                </div>


                <div class="member-card-name">

                    ${member.name}

                </div>


                <div class="member-card-role">

                    ${member.role}

                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    showMember(
                        member,
                        card
                    );

                }
            );


            peopleGrid.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   SHOW MEMBER
========================================================= */


function showMember(
    member,
    card
) {


    /*
      같은 카드 클릭 시 닫기
    */

    if (
        selectedCard === card
        &&
        memberDetail.classList.contains(
            "show"
        )
    ) {

        closeMember();

        return;
    }



    /* Selected card */

    document
        .querySelectorAll(
            ".member-card"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "selected"
                )
        );


    card.classList.add(
        "selected"
    );


    selectedCard =
        card;



    /* Basic */

    detailPhoto.src =
        member.photo;


    detailPhoto.alt =
        member.name;


    detailName.textContent =
        member.name;


    detailRole.textContent =
        member.role;



    /* =====================================================
       RESEARCH
    ====================================================== */


    detailResearch.innerHTML =
        "";


    if (
        member.research
        &&
        member.research.length
    ) {


        researchSection.style.display =
            "block";


        member.research.forEach(
            research => {


                const area =
                    document.createElement(
                        "div"
                    );


                area.className =
                    "research-area";


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "research-area-title";


                title.textContent =
                    research.area;


                area.appendChild(
                    title
                );


                if (
                    research.topics
                    &&
                    research.topics.length
                ) {


                    const ul =
                        document.createElement(
                            "ul"
                        );


                    research.topics.forEach(
                        topic => {


                            const li =
                                document.createElement(
                                    "li"
                                );


                            li.textContent =
                                topic;


                            ul.appendChild(
                                li
                            );


                        }
                    );


                    area.appendChild(
                        ul
                    );

                }


                detailResearch.appendChild(
                    area
                );

            }
        );


    } else {


        researchSection.style.display =
            "none";

    }



    /* =====================================================
       EDUCATION
    ====================================================== */


    renderTextArray(
        member.education,
        detailEducation,
        educationSection
    );



    /* =====================================================
       CAREER
    ====================================================== */


    renderTextArray(
        member.career,
        detailCareer,
        careerSection
    );



    /* =====================================================
       CONTACT
    ====================================================== */


    detailContact.innerHTML =
        "";


    if (member.email) {


        contactSection.style.display =
            "block";


        const email =
            document.createElement(
                "a"
            );


        email.className =
            "detail-email";


        email.href =
            `mailto:${member.email}`;


        email.textContent =
            member.email;


        detailContact.appendChild(
            email
        );


    } else {


        contactSection.style.display =
            "none";

    }



    /* =====================================================
       LINKS
    ====================================================== */


    detailLinks.innerHTML =
        "";


    if (
        member.links
        &&
        member.links.length
    ) {


        detailLinks.style.display =
            "flex";


        member.links.forEach(
            link => {


                const a =
                    document.createElement(
                        "a"
                    );


                a.className =
                    "member-link";


                a.href =
                    link.url;


                a.target =
                    "_blank";


                a.rel =
                    "noopener noreferrer";


                a.innerHTML = `

                    ${link.label}

                    <span>↗</span>

                `;


                detailLinks.appendChild(
                    a
                );

            }
        );


    } else {


        detailLinks.style.display =
            "none";

    }



    /* SHOW */

    memberDetail.classList.add(
        "show"
    );


    /*
      DSIL처럼 상세정보를
      카드 grid 위쪽에 표시
    */

    memberDetail.scrollIntoView({

        behavior:
            "smooth",

        block:
            "start"

    });


    /*
      URL에도 member 표시
    */

    const url =
        new URL(
            window.location
        );


    url.searchParams.set(
        "member",
        member.id
    );


    history.replaceState(
        null,
        "",
        url
    );

}


/* =========================================================
   TEXT ARRAY
========================================================= */


function renderTextArray(
    list,
    target,
    section
) {


    target.innerHTML =
        "";


    if (
        !list
        ||
        !list.length
    ) {


        section.style.display =
            "none";


        return;

    }


    section.style.display =
        "block";


    list.forEach(
        text => {


            const p =
                document.createElement(
                    "p"
                );


            p.textContent =
                text;


            target.appendChild(
                p
            );

        }
    );

}


/* =========================================================
   CLOSE MEMBER
========================================================= */


function closeMember() {


    memberDetail.classList.remove(
        "show"
    );


    if (selectedCard) {


        selectedCard.classList.remove(
            "selected"
        );

    }


    selectedCard =
        null;


    const url =
        new URL(
            window.location
        );


    url.searchParams.delete(
        "member"
    );


    history.replaceState(
        null,
        "",
        url
    );

}


detailClose.addEventListener(
    "click",
    closeMember
);


/* =========================================================
   TERM PICKER
========================================================= */


termTrigger.addEventListener(
    "click",
    event => {


        event.stopPropagation();


        termPicker.classList.toggle(
            "open"
        );


        termTrigger.setAttribute(
            "aria-expanded",
            termPicker.classList.contains(
                "open"
            )
        );

    }
);



termOptions.forEach(
    option => {


        option.addEventListener(
            "click",
            function() {


                const term =
                    this.dataset.term;


                termLabel.textContent =
                    this.textContent.trim();


                termOptions.forEach(
                    item => {


                        item.classList.remove(
                            "active"
                        );

                    }
                );


                this.classList.add(
                    "active"
                );


                termPicker.classList.remove(
                    "open"
                );


                termTrigger.setAttribute(
                    "aria-expanded",
                    "false"
                );


                renderPeople(
                    term
                );

            }
        );

    }
);



document.addEventListener(
    "click",
    event => {


        if (
            !termPicker.contains(
                event.target
            )
        ) {


            termPicker.classList.remove(
                "open"
            );


            termTrigger.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }
);


/* =========================================================
   INITIAL
========================================================= */


renderPeople(
    "current"
);

</script>


</body>
</html>
