<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #ffffff;
    color: #111111;

    font-family:
        Arial,
        "Helvetica Neue",
        Helvetica,
        sans-serif;
}

button {
    font-family: inherit;
}


/* =========================
   PAGE
========================= */

.people-wrap {
    width: 100%;
    max-width: 1500px;

    margin: 0 auto;

    padding:
        48px
        clamp(28px, 5vw, 80px)
        100px;
}


/* =========================
   HEADER
========================= */

.people-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 42px;
}

.people-title {
    margin: 0;

    font-size: 40px;
    line-height: 1;

    font-weight: 700;

    letter-spacing: -1.2px;
}


/* =========================
   CURRENT
========================= */

.people-filter {
    font-size: 14px;
}

.filter-button {
    border: 0;
    background: transparent;

    padding: 4px 0;

    color: #111;

    font-size: 14px;

    cursor: default;
}


/* =========================
   GRID
========================= */

.people-grid {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    column-gap:
        clamp(18px, 2vw, 30px);

    row-gap: 52px;
}


/* =========================
   CARD
========================= */

.member-card {
    display: block;

    width: 100%;
    min-width: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    color: inherit;

    text-align: left;

    cursor: pointer;
}


/* photo */

.member-photo-wrap {
    position: relative;

    width: 100%;

    aspect-ratio: 4 / 5;

    overflow: hidden;

    margin-bottom: 14px;

    background: #eeeeee;
}

.member-photo {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;

    transition:
        transform 0.3s ease,
        opacity 0.3s ease;
}

.member-card:hover .member-photo {
    transform: scale(1.025);

    opacity: 0.94;
}


/* image fallback */

.photo-fallback {
    display: none;

    position: absolute;

    inset: 0;

    align-items: center;
    justify-content: center;

    padding: 15px;

    color: #999;

    font-size: 18px;

    font-weight: 700;

    text-align: center;
}


/* text */

.member-name {
    margin-bottom: 5px;

    font-size: 17px;

    line-height: 1.3;

    font-weight: 700;
}

.member-role {
    color: #6b6b6b;

    font-size: 13px;

    line-height: 1.45;
}


/* =========================
   DETAIL
========================= */

.people-detail {
    display: none;

    position: relative;

    width: 100%;

    margin-bottom: 55px;

    padding-bottom: 50px;

    border-bottom: 1px solid #d6d6d6;
}

.people-detail.show {
    display: block;
}

.detail-layout {
    display: grid;

    grid-template-columns:
        minmax(240px, 30%)
        minmax(0, 1fr);

    gap:
        clamp(42px, 6vw, 85px);
}

.detail-photo {
    width: 100%;

    aspect-ratio: 4 / 5;

    overflow: hidden;

    background: #eee;
}

.detail-photo img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.detail-content {
    padding-top: 4px;
}

.detail-name {
    margin:
        0
        0
        8px;

    font-size: 38px;

    font-weight: 700;

    line-height: 1.15;
}

.detail-role {
    margin-bottom: 34px;

    color: #666;

    font-size: 16px;
}

.detail-heading {
    margin-top: 28px;
    margin-bottom: 9px;

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 1px;

    text-transform: uppercase;
}

.detail-body {
    color: #333;

    font-size: 15px;

    line-height: 1.7;
}

.detail-email {
    color: #111;

    text-decoration: none;

    border-bottom: 1px solid #bbb;
}


/* close */

.detail-close {
    position: absolute;

    top: 0;
    right: 0;

    width: 36px;
    height: 36px;

    border: 0;

    background: transparent;

    cursor: pointer;
}

.detail-close::before,
.detail-close::after {
    content: "";

    position: absolute;

    width: 26px;
    height: 1.5px;

    top: 17px;
    left: 5px;

    background: #111;
}

.detail-close::before {
    transform: rotate(45deg);
}

.detail-close::after {
    transform: rotate(-45deg);
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1200px) {

    .people-grid {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }

}

@media (max-width: 900px) {

    .people-grid {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));
    }

@media (max-width: 620px) {

    .people-wrap {

    }

        row-gap: 34px;
    }

    .detail-layout {
        display: block;
    }

    .detail-photo {
        margin-bottom: 28px;
    }

}

</style>

<script>

/* =========================================================
   IMAGE FALLBACK
========================================================= */

document
    .querySelectorAll(".member-photo")
    .forEach(function(img) {

        img.addEventListener(
            "error",
            function() {

                img.style.display =
                    "none";

                const fallback =
                    img.parentElement.querySelector(
                        ".photo-fallback"
                    );

                if (fallback) {
                    fallback.style.display =
                        "flex";
                }

            }
        );

    });



/* =========================================================
   DETAIL
========================================================= */

const detail =
    document.getElementById(
        "memberDetail"
    );

const detailName =
    document.getElementById(
        "detailName"
    );

const detailRole =
    document.getElementById(
        "detailRole"
    );

const detailResearch =
    document.getElementById(
        "detailResearch"
    );

const detailContact =
    document.getElementById(
        "detailContact"
    );

const detailPhoto =
    document.getElementById(
        "detailPhoto"
    );

const detailClose =
    document.getElementById(
        "detailClose"
    );


document
    .querySelectorAll(".member-card")
    .forEach(function(card) {

        card.addEventListener(
            "click",
            function() {

                const name =
                    card.dataset.name;

                const role =
                    card.dataset.role;

                const research =
                    card.dataset.research;

                const email =
                    card.dataset.email;

                const photo =
                    card.dataset.photo;


                detailName.textContent =
                    name;


                if (role) {

                    detailRole.style.display =
                        "block";

                    detailRole.textContent =
                        role;

                } else {

                    detailRole.style.display =
                        "none";

                }


                detailResearch.textContent =
                    research;


                detailContact.innerHTML =
                    "";

                const emailLink =
                    document.createElement(
                        "a"
                    );

                emailLink.className =
                    "detail-email";

                emailLink.href =
                    "mailto:" + email;

                emailLink.textContent =
                    email;

                detailContact.appendChild(
                    emailLink
                );


                detailPhoto.src =
                    photo;

                detailPhoto.alt =
                    name;


                detail.classList.add(
                    "show"
                );


                detail.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            }
        );

    });



detailClose.addEventListener(
    "click",
    function() {

        detail.classList.remove(
            "show"
        );

    }
);

</script>
