<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #ffffff;
    color: #111111;

    font-family:
        Arial,
        "Helvetica Neue",
        Helvetica,
        sans-serif;
}

button,
a {
    font-family: inherit;
}


/* =========================================================
   PAGE
========================================================= */

.people-wrap {
    width: 100%;
    max-width: 1500px;

    margin: 0 auto;

    padding:
        48px
        clamp(28px, 5vw, 80px)
        100px;
}


/* =========================================================
   DETAIL PANEL
   기본 상태에서는 아예 공간을 차지하지 않음
========================================================= */

.people-detail {
    display: none;

    position: relative;

    width: 100%;

    margin-bottom: 55px;

    padding-bottom: 50px;

    border-bottom: 1px solid #d5d5d5;
}

.people-detail.show {
    display: block;

    animation: detailOpen 0.25s ease;
}

@keyframes detailOpen {

    from {
        opacity: 0;
        transform: translateY(-8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   DETAIL CLOSE
========================================================= */

.detail-close {
    position: absolute;

    top: 0;
    right: 0;

    width: 36px;
    height: 36px;

    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    z-index: 5;
}

.detail-close::before,
.detail-close::after {
    content: "";

    position: absolute;

    top: 17px;
    left: 5px;

    width: 26px;
    height: 1.5px;

    background: #111;
}

.detail-close::before {
    transform: rotate(45deg);
}

.detail-close::after {
    transform: rotate(-45deg);
}


/* =========================================================
   DETAIL LAYOUT
========================================================= */

.detail-layout {
    display: grid;

    grid-template-columns:
        minmax(240px, 30%)
        minmax(0, 1fr);

    gap: clamp(42px, 6vw, 85px);
}


/* photo */

.detail-photo {
    position: relative;

    width: 100%;

    aspect-ratio: 4 / 5;

    overflow: hidden;

    background: #eeeeee;
}

.detail-photo img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center center;
}


/* fallback */

.detail-photo-fallback {
    display: none;

    position: absolute;

    inset: 0;

    align-items: center;
    justify-content: center;

    padding: 20px;

    text-align: center;

    font-size: 24px;

    font-weight: 700;

    color: #999999;
}


/* content */

.detail-content {
    padding-top: 4px;
    padding-right: 45px;
}

.detail-name {
    margin: 0 0 8px;

    font-size: clamp(30px, 3vw, 42px);

    line-height: 1.12;

    font-weight: 700;

    letter-spacing: -0.8px;
}

.detail-role {
    margin-bottom: 35px;

    color: #666666;

    font-size: 16px;

    line-height: 1.5;
}


/* =========================================================
   DETAIL SECTIONS
========================================================= */

.detail-section {
    margin-top: 28px;
}

.detail-heading {
    margin-bottom: 10px;

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 1.1px;

    text-transform: uppercase;
}

.detail-body {
    color: #333333;

    font-size: 15px;

    line-height: 1.75;
}

.detail-body p {
    margin: 0 0 6px;
}

.detail-email {
    color: #111111;

    text-decoration: none;

    border-bottom: 1px solid #bdbdbd;
}

.detail-email:hover {
    border-bottom-color: #111111;
}


/* =========================================================
   HEADER
========================================================= */

.people-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 42px;
}

.people-title {
    margin: 0;

    font-size: 40px;

    line-height: 1;

    font-weight: 700;

    letter-spacing: -1.2px;
}


/* =========================================================
   CURRENT DROPDOWN
========================================================= */

.people-filter {
    position: relative;
}

.filter-button {
    display: flex;

    align-items: center;

    gap: 8px;

    padding: 5px 0;

    border: 0;

    background: transparent;

    color: #111111;

    font-size: 14px;

    cursor: pointer;
}

.filter-chevron {
    display: inline-block;

    font-size: 10px;

    transition: transform 0.2s ease;
}

.people-filter.open .filter-chevron {
    transform: rotate(180deg);
}

.filter-menu {
    display: none;

    position: absolute;

    top: calc(100% + 8px);
    right: 0;

    min-width: 130px;

    background: #ffffff;

    border: 1px solid #dddddd;

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.07);

    z-index: 50;
}

.people-filter.open .filter-menu {
    display: block;
}

.filter-option {
    display: block;

    width: 100%;

    padding: 11px 15px;

    border: 0;

    background: #ffffff;

    text-align: left;

    color: #222222;

    font-size: 14px;

    cursor: pointer;
}

.filter-option:hover {
    background: #f4f4f4;
}

.filter-option.active {
    font-weight: 700;
}


/* =========================================================
   PEOPLE GRID
========================================================= */

.people-grid {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    column-gap: clamp(18px, 2vw, 30px);

    row-gap: 52px;
}


/* =========================================================
   MEMBER CARD
========================================================= */

.member-card {
    display: block;

    width: 100%;

    min-width: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    color: inherit;

    text-align: left;

    cursor: pointer;

    appearance: none;
}


/* =========================================================
   CARD PHOTO
========================================================= */

.member-photo-wrap {
    position: relative;

    width: 100%;

    aspect-ratio: 4 / 5;

    overflow: hidden;

    margin-bottom: 14px;

    background: #eeeeee;
}

.member-photo {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center center;

    transition:
        transform 0.3s ease,
        opacity 0.3s ease;
}

.member-card:hover .member-photo {
    transform: scale(1.025);

    opacity: 0.94;
}


/* 사진 없을 때 */

.member-photo-fallback {
    display: none;

    position: absolute;

    inset: 0;

    align-items: center;
    justify-content: center;

    padding: 15px;

    text-align: center;

    color: #999999;

    font-size: 20px;

    font-weight: 700;
}


/* selected */

.member-card.selected
.member-photo-wrap::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 3px;

    background: #111111;
}


/* =========================================================
   CARD TEXT
========================================================= */

.member-name {
    margin-bottom: 6px;

    font-size: 17px;

    line-height: 1.3;

    font-weight: 700;

    letter-spacing: -0.2px;
}

.member-role {
    color: #6c6c6c;

    font-size: 13px;

    line-height: 1.45;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1200px) {

    .people-grid {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }

}


@media (max-width: 900px) {

    .people-grid {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));
    }

    .detail-layout {
        grid-template-columns:
            minmax(220px, 34%)
            minmax(0, 1fr);

        gap: 38px;
    }

}


@media (max-width: 620px) {

    .people-wrap {
        padding:
            28px
            14px
            60px;
    }

    .people-header {
        margin-bottom: 28px;
    }

    .people-title {
        font-size: 30px;
    }

    .people-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        column-gap: 14px;

        row-gap: 34px;
    }

    .member-name {
        font-size: 15px;
    }

    .member-role {
        font-size: 12px;
    }

    .detail-layout {
        display: block;
    }

    .detail-photo {
        max-width: 420px;

        margin:
            0 auto
            28px;
    }

    .detail-content {
        padding-right: 0;
    }

    .detail-close {
        top: -42px;
    }

}

</style>

/* =========================================================
   CARD PHOTO FALLBACK
========================================================= */

function setImageFallback(
    image,
    fallback,
    name
) {

    fallback.textContent =
        name;


    image.onload =
        function() {

            image.style.display =
                "block";


            fallback.style.display =
                "none";

        };


    image.onerror =
        function() {

            image.style.display =
                "none";


            fallback.style.display =
                "flex";

        };

}


/* =========================================================
   RENDER PEOPLE
========================================================= */

function renderPeople(
    group
) {

    peopleGrid.innerHTML =
        "";


    closeMember();


    const members =
        peopleData[group] || [];


    /*
       Alumni가 비어있는 경우
    */

    if (
        members.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.style.gridColumn =
            "1 / -1";


        empty.style.padding =
            "30px 0";


        empty.style.color =
            "#777";


        empty.style.fontSize =
            "14px";


        empty.textContent =
            "No members are currently listed.";


        peopleGrid.appendChild(
            empty
        );


        return;
    }


    members.forEach(
        function(member) {


            const card =
                document.createElement(
                    "button"
                );


            card.type =
                "button";


            card.className =
                "member-card";


            /*
               마지막 학부연구생들은
               role이 없으므로 연구분야 표시
            */

            const subtitle =
                member.role
                ? member.role
                : member.research;


            /*
               Student Leader 표시
            */

            const displayName =
                member.leader
                ? member.name +
                  " (Student Leader)"
                : member.name;


            card.innerHTML = `

                <div
                    class="member-photo-wrap"
                >

                    <img
                        class="member-photo"
                        src="${member.photo}"
                        alt="${displayName}"
                        loading="lazy"
                        decoding="async"
                    >

                    <div
                        class="member-photo-fallback"
                    >
                        ${displayName}
                    </div>

                </div>


                <div
                    class="member-name"
                >
                    ${displayName}
                </div>


                <div
                    class="member-role"
                >
                    ${subtitle}
                </div>

            `;


            const image =
                card.querySelector(
                    ".member-photo"
                );


            const fallback =
                card.querySelector(
                    ".member-photo-fallback"
                );


            setImageFallback(
                image,
                fallback,
                displayName
            );


            card.addEventListener(
                "click",
                function() {

                    showMember(
                        member,
                        card
                    );

                }
            );


            peopleGrid.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   SHOW DETAIL
========================================================= */

function showMember(
    member,
    card
) {

    /*
       같은 카드 다시 클릭
       → 닫기
    */

    if (
        selectedCard === card
        &&
        memberDetail.classList.contains(
            "show"
        )
    ) {

        closeMember();

        return;
    }


    /*
       selected 상태 제거
    */

    const cards =
        document.querySelectorAll(
            ".member-card"
        );


    cards.forEach(
        function(item) {

            item.classList.remove(
                "selected"
            );

        }
    );


    card.classList.add(
        "selected"
    );


    selectedCard =
        card;


    /*
       이름
    */

    const displayName =
        member.leader
            ? member.name +
              " (Student Leader)"
            : member.name;


    detailName.textContent =
        displayName;


    /*
       Role
    */

    if (member.role) {

        detailRole.style.display =
            "block";


        detailRole.textContent =
            member.role;

    } else {

        detailRole.style.display =
            "none";

    }


    /*
       Research
    */

    if (member.research) {

        detailResearchSection.style.display =
            "block";


        detailResearch.textContent =
            member.research;

    } else {

        detailResearchSection.style.display =
            "none";

    }


    /*
       Contact
    */

    detailContact.innerHTML =
        "";


    if (member.email) {

        detailContactSection.style.display =
            "block";


        const email =
            document.createElement(
                "a"
            );


        email.className =
            "detail-email";


        email.href =
            "mailto:" +
            member.email;


        email.textContent =
            member.email;


        detailContact.appendChild(
            email
        );

    } else {

        detailContactSection.style.display =
            "none";

    }


    /*
       Photo
    */

    detailPhoto.src =
        member.photo;


    detailPhoto.alt =
        displayName;


    setImageFallback(
        detailPhoto,
        detailPhotoFallback,
        displayName
    );


    /*
       detail 표시
    */

    memberDetail.classList.add(
        "show"
    );


    /*
       detail 상단으로 이동
    */

    setTimeout(
        function() {

            memberDetail.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        },
        20
    );

}


/* =========================================================
   CLOSE DETAIL
========================================================= */

function closeMember() {

    memberDetail.classList.remove(
        "show"
    );


    if (selectedCard) {

        selectedCard.classList.remove(
            "selected"
        );

    }


    selectedCard =
        null;

}


detailClose.addEventListener(
    "click",
    function() {

        closeMember();

    }
);


/* =========================================================
   FILTER MENU
========================================================= */

filterButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        peopleFilter.classList.toggle(
            "open"
        );

    }
);



filterOptions.forEach(
    function(option) {

        option.addEventListener(
            "click",
            function() {


                const group =
                    option.getAttribute(
                        "data-filter"
                    );


                currentGroup =
                    group;


                filterOptions.forEach(
                    function(item) {

                        item.classList.remove(
                            "active"
                        );

                    }
                );


                option.classList.add(
                    "active"
                );


                filterLabel.textContent =
                    option.textContent.trim();


                peopleFilter.classList.remove(
                    "open"
                );


                renderPeople(
                    currentGroup
                );

            }
        );

    }
);



document.addEventListener(
    "click",
    function(event) {

        if (
            !peopleFilter.contains(
                event.target
            )
        ) {

            peopleFilter.classList.remove(
                "open"
            );

        }

    }
);


/* =========================================================
   INITIAL LOAD

   ★ 이 부분이 실제 카드들을 생성함
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        renderPeople(
            "current"
        );

    }
);

</script>
